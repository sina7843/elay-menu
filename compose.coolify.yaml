# Elay Menu on Coolify (resource type: Docker Compose). Same three services as compose.yaml:
#   web (nginx + built Vue app, proxies /api) -> api (Fastify) -> mongo.
# No host ports are published: Coolify's proxy routes the domain to web:8080; api and mongo stay internal.
# Set PUBLIC_MENU_URL (and optionally the other variables in coolify.env.example) in Coolify's environment.
services:
  mongo:
    image: mongo:8.0
    restart: unless-stopped
    volumes:
      - elay_mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      API_HOST: 0.0.0.0
      API_PORT: "3000"
      MONGODB_URI: mongodb://mongo:27017/elay
      MEDIA_DIR: /data/media
      PUBLIC_MENU_URL: ${PUBLIC_MENU_URL:?set production menu URL}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-12}
      LOGIN_RATE_LIMIT_PER_15M: ${LOGIN_RATE_LIMIT_PER_15M:-10}
      # The API is only reachable through the web proxy, which overwrites forwarding headers.
      TRUST_PROXY: "true"
    volumes:
      - elay_media_data:/data/media
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    expose:
      - "8080"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 5s
      retries: 5

# Fixed names so Coolify redeployments reuse the same database and uploaded media.
volumes:
  elay_mongo_data:
    name: elay_mongo_data
  elay_media_data:
    name: elay_media_data
